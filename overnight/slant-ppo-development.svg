   <text style="font-size: 10px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #263449" transform="translate(7.972734 333.163625)">Seven unique fixed development conditions. All fourteen plays fail endpoint retention.</text>
