name: CPU tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  model-free:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - run: uv sync --locked --python 3.12 --extra wbc --extra test
      - name: Synthetic-fixture tests (no robot assets or weights)
        run: >-
          uv run --no-sync pytest -q
          tests/test_perception.py tests/test_catching.py
          tests/test_observable.py tests/test_routes_evaluation.py
          tests/test_running_catch_eval.py tests/test_receiver_comparison_plot.py
          tests/test_rgbd_impairments.py tests/test_anatomical_catch_eval.py
          tests/test_precontact_native_rl.py tests/test_transport_precontact_rl.py
          tests/test_persistent_finger_regulation.py
      - run: uv run --no-sync python scripts/summarize_evidence.py
